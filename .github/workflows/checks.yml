name: Frontend checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm audit --omit=dev
      - run: npm run lint
      - run: npm run build
        env:
          VITE_DEMO_MODE: "true"
      - uses: actions/upload-artifact@v4
        with:
          name: sifit-demo-web
          path: dist
